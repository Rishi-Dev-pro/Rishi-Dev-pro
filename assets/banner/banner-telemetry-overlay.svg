<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="100%" role="img" aria-label="Telemetry Overlay">
  <title>Telemetry Overlay</title>
  <defs>
    <linearGradient id="bto-telemetry-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="0" y="29" width="1200" height="2" fill="url(#bto-telemetry-line)" />
  
  <g transform="translate(60, 20)">
    <rect x="0" y="0" width="16" height="16" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="8" cy="8" r="3" fill="#00F0FF" />
    <text x="24" y="13" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#00F0FF" letter-spacing="1.5">SYS.LOC // 0x4A8F</text>
  </g>

  <g transform="translate(980, 20)">
    <text x="0" y="13" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#94A3B8" letter-spacing="1.5">TELEMETRY: ACTIVE</text>
    <circle cx="140" cy="8" r="4" fill="#00F0FF" />
  </g>
</svg>
