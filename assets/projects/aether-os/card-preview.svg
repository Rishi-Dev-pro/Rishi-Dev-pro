<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ae-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <linearGradient id="ae-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="ae-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="ae-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ae-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect x="0" y="0" width="1200" height="675" rx="16" fill="url(#ae-bg-grad)" stroke="url(#ae-border-grad)" stroke-width="2" />

  <!-- Background Tech Grid -->
  <g stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 1170 60 L 1170 30 L 1140 30" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 30 615 L 30 645 L 60 645" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 1170 615 L 1170 645 L 1140 645" fill="none" stroke="#00F0FF" stroke-width="2" />

  <!-- Top System Badge -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00F0FF" />
    <text x="30" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#00F0FF" letter-spacing="1">FLAGSHIP OS</text>
  </g>

  <!-- Central Spatial Computer Vision HUD Graphic -->
  <g transform="translate(600, 250)">
    <!-- Outer Radar Concentric Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#00F0FF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6,6" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#3B82F6" stroke-opacity="0.25" stroke-width="1.5" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.5" filter="url(#ae-cyan-glow)" />

    <!-- Crosshair Lines -->
    <line x1="-180" y1="0" x2="-130" y2="0" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <line x1="130" y1="0" x2="180" y2="0" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <line x1="0" y1="-180" x2="0" y2="-130" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <line x1="0" y1="130" x2="0" y2="180" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />

    <!-- Hand Tracking Landmark Points -->
    <g filter="url(#ae-cyan-glow)">
      <!-- Wrist & Palm Core -->
      <circle cx="0" cy="40" r="5" fill="#00F0FF" />
      <circle cx="-25" cy="15" r="4" fill="#00F0FF" />
      <circle cx="0" cy="0" r="6" fill="#00F0FF" />
      <circle cx="25" cy="15" r="4" fill="#00F0FF" />

      <!-- Fingertips -->
      <circle cx="-50" cy="-35" r="4" fill="#00F0FF" />
      <circle cx="-20" cy="-60" r="4" fill="#00F0FF" />
      <circle cx="10" cy="-65" r="4" fill="#00F0FF" />
      <circle cx="40" cy="-45" r="4" fill="#00F0FF" />
      <circle cx="55" cy="-10" r="4" fill="#00F0FF" />

      <!-- Skeleton Lines -->
      <line x1="0" y1="40" x2="-25" y2="15" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="0" y1="40" x2="0" y2="0" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="0" y1="40" x2="25" y2="15" stroke="#00F0FF" stroke-width="1.5" />

      <line x1="-25" y1="15" x2="-50" y2="-35" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="-25" y1="15" x2="-20" y2="-60" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="0" y1="0" x2="10" y2="-65" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="25" y1="15" x2="40" y2="-45" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="25" y1="15" x2="55" y2="-10" stroke="#00F0FF" stroke-width="1.5" />
    </g>

    <!-- Voice Waveform Overlay -->
    <g transform="translate(0, 110)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#0F172A" fill-opacity="0.8" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <line x1="-50" y1="0" x2="-40" y2="0" stroke="#00F0FF" stroke-width="2" />
      <line x1="-35" y1="-6" x2="-35" y2="6" stroke="#00F0FF" stroke-width="2" />
      <line x1="-25" y1="-3" x2="-25" y2="3" stroke="#00F0FF" stroke-width="2" />
      <line x1="-15" y1="-9" x2="-15" y2="9" stroke="#00F0FF" stroke-width="2" />
      <line x1="-5" y1="-4" x2="-5" y2="4" stroke="#00F0FF" stroke-width="2" />
      <line x1="5" y1="-8" x2="5" y2="8" stroke="#00F0FF" stroke-width="2" />
      <line x1="15" y1="-2" x2="15" y2="2" stroke="#00F0FF" stroke-width="2" />
      <line x1="25" y1="-7" x2="25" y2="7" stroke="#00F0FF" stroke-width="2" />
      <line x1="35" y1="-3" x2="35" y2="3" stroke="#00F0FF" stroke-width="2" />
      <line x1="45" y1="0" x2="50" y2="0" stroke="#00F0FF" stroke-width="2" />
    </g>
  </g>

  <!-- Lower Glassmorphism Panel -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="1100" height="175" rx="12" fill="url(#ae-glass-grad)" stroke="url(#ae-border-grad)" stroke-width="1.5" />

    <!-- Project Identifier -->
    <text x="35" y="35" font-family="monospace" font-size="12" font-weight="bold" fill="#00F0FF" letter-spacing="2">PROJECT MODULE // 01</text>

    <!-- Main Title -->
    <text x="35" y="75" font-family="sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="1">AETHER OS</text>

    <!-- Tagline -->
    <text x="35" y="105" font-family="sans-serif" font-size="16" fill="#94A3B8">Browser-Based Spatial AI Operating System • Computer Vision • Voice AI • Gesture HUD</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(35, 125)">
      <!-- React -->
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">React</text>

      <!-- Python -->
      <rect x="85" y="0" width="80" height="24" rx="4" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="125" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">Python</text>

      <!-- OpenCV -->
      <rect x="175" y="0" width="85" height="24" rx="4" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="217" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">OpenCV</text>

      <!-- MediaPipe -->
      <rect x="270" y="0" width="95" height="24" rx="4" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="317" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">MediaPipe</text>

      <!-- Socket.IO -->
      <rect x="375" y="0" width="90" height="24" rx="4" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="420" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">Socket.IO</text>
    </g>

    <!-- Right Side Status Metric -->
    <g transform="translate(930, 40)">
      <text x="120" y="20" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">STATUS</text>
      <text x="120" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#00F0FF" text-anchor="end">ONLINE // 60 FPS</text>
      
      <text x="120" y="80" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">ARCHITECTURE</text>
      <text x="120" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#E2E8F0" text-anchor="end">SPATIAL HUD</text>
    </g>
  </g>
</svg>
