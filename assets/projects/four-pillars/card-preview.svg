<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" role="img" aria-label="The Four Pillars Card Preview">
  <title>The Four Pillars Card Preview</title>
  <defs>
    <linearGradient id="fp-pillars-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A" stop-opacity="1" />
      <stop offset="100%" stop-color="#0E131F" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="fp-pillar-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="16" fill="url(#fp-pillars-bg)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Four Pillars 3D Perspective Graphic -->
  <g transform="translate(600, 240)">
    <!-- Pillar 1 -->
    <rect x="-160" y="-100" width="40" height="200" rx="6" fill="#121826" fill-opacity="0.8" stroke="url(#fp-pillar-glow)" stroke-width="2" />
    <!-- Pillar 2 -->
    <rect x="-70" y="-140" width="40" height="240" rx="6" fill="#121826" fill-opacity="0.8" stroke="url(#fp-pillar-glow)" stroke-width="2" />
    <!-- Pillar 3 -->
    <rect x="30" y="-120" width="40" height="220" rx="6" fill="#121826" fill-opacity="0.8" stroke="url(#fp-pillar-glow)" stroke-width="2" />
    <!-- Pillar 4 -->
    <rect x="120" y="-80" width="40" height="180" rx="6" fill="#121826" fill-opacity="0.8" stroke="url(#fp-pillar-glow)" stroke-width="2" />
  </g>

  <!-- Details Overlay -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#94A3B8" letter-spacing="2">PROJECT // 03</text>
    <text x="0" y="42" font-family="'Outfit', 'SF Pro Display', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">The Four Pillars</text>
    <text x="0" y="72" font-family="'SF Pro Text', 'Inter', sans-serif" font-size="16" fill="#94A3B8">Modern Team Portfolio Showcasing Creative Engineering &amp; Design Excellence</text>
  </g>
</svg>
