<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" role="img" aria-label="Mochi Card Preview">
  <title>Mochi Card Preview</title>
  <defs>
    <linearGradient id="mo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" stop-opacity="1" />
      <stop offset="100%" stop-color="#1A102F" stop-opacity="1" />
    </linearGradient>
    <filter id="mo-purple-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" rx="16" fill="url(#mo-bg)" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Cute AI Companion Art -->
  <g transform="translate(600, 240)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="100" fill="#7C3AED" fill-opacity="0.15" filter="url(#mo-purple-glow)" />
    <!-- Character Sphere -->
    <circle cx="0" cy="0" r="70" fill="#121826" stroke="#7C3AED" stroke-width="2" />
    <!-- Cute Eyes -->
    <ellipse cx="-20" cy="-10" rx="8" ry="12" fill="#00F0FF" />
    <ellipse cx="20" cy="-10" rx="8" ry="12" fill="#00F0FF" />
    <!-- Cute Mouth -->
    <path d="M -10 15 Q 0 25 10 15" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Details Overlay -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7C3AED" letter-spacing="2">UPCOMING // AI COMPANION</text>
    <text x="0" y="42" font-family="'Outfit', 'SF Pro Display', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Mochi</text>
    <text x="0" y="72" font-family="'SF Pro Text', 'Inter', sans-serif" font-size="16" fill="#94A3B8">An AI Companion Designed to Assist and Connect Lonely Developers</text>
  </g>
</svg>
