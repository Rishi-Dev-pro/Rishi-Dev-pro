<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" role="img" aria-label="Campus Resolve Card Preview">
  <title>Campus Resolve Card Preview</title>
  <defs>
    <linearGradient id="cr-campus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" stop-opacity="1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="16" fill="url(#cr-campus-bg)" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- SaaS Dashboard Wireframe Art -->
  <g transform="translate(600, 240)">
    <rect x="-180" y="-100" width="360" height="200" rx="8" fill="#121826" fill-opacity="0.8" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="-180" y1="-70" x2="180" y2="-70" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="-160" cy="-85" r="4" fill="#00F0FF" />
    <circle cx="-145" cy="-85" r="4" fill="#3B82F6" />
    <circle cx="-130" cy="-85" r="4" fill="#7C3AED" />

    <!-- Analytics Mock Bars -->
    <rect x="-140" y="-40" width="40" height="110" rx="4" fill="#00F0FF" fill-opacity="0.4" />
    <rect x="-80" y="-10" width="40" height="80" rx="4" fill="#3B82F6" fill-opacity="0.4" />
    <rect x="-20" y="-50" width="40" height="120" rx="4" fill="#00F0FF" fill-opacity="0.6" />
    <rect x="40" y="10" width="40" height="60" rx="4" fill="#7C3AED" fill-opacity="0.4" />
    <rect x="100" y="-30" width="40" height="100" rx="4" fill="#00F0FF" fill-opacity="0.3" />
  </g>

  <!-- Details Overlay -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#00F0FF" letter-spacing="2">PROJECT // SAAS PLATFORM</text>
    <text x="0" y="42" font-family="'Outfit', 'SF Pro Display', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Campus Resolve</text>
    <text x="0" y="72" font-family="'SF Pro Text', 'Inter', sans-serif" font-size="16" fill="#94A3B8">SaaS Problem Reporting Platform for Universities with Role-Based Access Control</text>
  </g>
</svg>
