<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 28" width="160" height="28" role="img" aria-label="Status: System Live">
  <title>Status: System Live</title>
  <defs>
    <filter id="sl-glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="160" height="28" rx="14" fill="#0D111A" fill-opacity="0.85" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="16" cy="14" r="4" fill="#00F0FF" filter="url(#sl-glow-dot)" />
  <text x="28" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#F8FAFC" font-weight="600" letter-spacing="1">SYSTEM LIVE</text>
</svg>
