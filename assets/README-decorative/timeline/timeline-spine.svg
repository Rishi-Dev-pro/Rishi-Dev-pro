<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 80" width="4" height="80" role="img" aria-label="Timeline Spine">
  <title>Timeline Spine Connector</title>
  <defs>
    <linearGradient id="spine-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  <rect x="1" y="0" width="2" height="80" fill="url(#spine-grad)" rx="1" />
</svg>
