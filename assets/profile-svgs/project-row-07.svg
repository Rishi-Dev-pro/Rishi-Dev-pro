<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="spine-grad-07" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="node-glow-07" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ss-border-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <filter id="card-shadow-07" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38BDF8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Vertical Spine (Continuous through 340px) -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-07)" stroke-width="4" filter="url(#node-glow-07)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Numbered Glowing Node (60px diameter) -->
  <g transform="translate(600, 170)">
    <circle cx="0" cy="0" r="38" fill="#C084FC" fill-opacity="0.45" filter="url(#node-glow-07)" />
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#C084FC" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">07</text>
  </g>

  <!-- Big Screenshot Card (480px x 270px) -->
  <g transform="translate(40, 35)" filter="url(#card-shadow-07)">
    <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-07)" stroke-width="1.8" />
    
        <rect width="480" height="270" rx="14" fill="#070B14" />
        <rect width="480" height="28" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#EF4444" />
        <circle cx="28" cy="14" r="4" fill="#F59E0B" />
        <circle cx="40" cy="14" r="4" fill="#10B981" />
        <text x="60" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">rishishaw.dev</text>
        <!-- Mini Hero Card inside -->
        <g transform="translate(30, 50)">
          <!-- Mini Avatar -->
          <circle cx="35" cy="45" r="28" fill="none" stroke="#00F0FF" stroke-width="2" />
          <circle cx="35" cy="45" r="24" fill="#1E293B" />
          <!-- Name & Role -->
          <text x="75" y="36" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">Hi, I'm</text>
          <text x="75" y="52" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Rishi <tspan fill="#C084FC">Shaw</tspan></text>
          <text x="75" y="66" font-family="-apple-system, sans-serif" font-size="8" fill="#64748B">AI Engineer &#8226; Full Stack Developer</text>
          <!-- Mini buttons -->
          <rect x="75" y="78" width="70" height="18" rx="6" fill="#6366F1" />
          <text x="110" y="90" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">View Work</text>
        </g>
        <!-- Mini Quote Card -->
        <rect x="250" y="55" width="200" height="85" rx="8" fill="#0B1122" stroke="#334155" stroke-width="1" />
        <text x="262" y="75" font-family="-apple-system, sans-serif" font-size="8.5" fill="#CBD5E1">Engineering is not just</text>
        <text x="262" y="88" font-family="-apple-system, sans-serif" font-size="8.5" fill="#CBD5E1">about writing code...</text>
        <text x="435" y="102" font-family="-apple-system, sans-serif" font-size="8" fill="#64748B" text-anchor="end">&#8212; Rishi Shaw</text>
        <!-- Mini Stats Bar -->
        <rect x="30" y="165" width="420" height="70" rx="10" fill="#0A1020" stroke="#1E293B" stroke-width="1" />
        <circle cx="60" cy="200" r="16" fill="#8B5CF6" fill-opacity="0.2" />
        <circle cx="170" cy="200" r="16" fill="#FACC15" fill-opacity="0.2" />
        <circle cx="280" cy="200" r="16" fill="#38BDF8" fill-opacity="0.2" />
        <circle cx="390" cy="200" r="16" fill="#FB923C" fill-opacity="0.2" />
        
  </g>

  <!-- Project Description Card -->
  <g transform="translate(670, 50)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">Portfolio Website</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8">Personal Portfolio</text>
    
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#CBD5E1">
      <tspan x="0" dy="0">A modern, responsive portfolio to showcase my</tspan>
      <tspan x="0" dy="24">projects, skills and journey.</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(0, 155)">
      
        <g transform="translate(0, 0)">
          <rect width="58" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="29" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">HTML</text>
        </g>
        
        <g transform="translate(66, 0)">
          <rect width="49" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">CSS</text>
        </g>
        
        <g transform="translate(123, 0)">
          <rect width="112" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="56" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">JavaScript</text>
        </g>
        
        <g transform="translate(243, 0)">
          <rect width="58" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="29" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">GSAP</text>
        </g>
        
    </g>

    <!-- Action Links -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">Live Demo ↗   |   GitHub ↗</text>
    </g>
  </g>
</svg>