<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="spine-grad-08" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="node-glow-08" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ss-border-08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <filter id="card-shadow-08" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38BDF8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Vertical Spine (Continuous through 340px) -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-08)" stroke-width="4" filter="url(#node-glow-08)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Numbered Glowing Node (60px diameter) -->
  <g transform="translate(600, 170)">
    <circle cx="0" cy="0" r="38" fill="#00F0FF" fill-opacity="0.45" filter="url(#node-glow-08)" />
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">08</text>
  </g>

  <!-- Big Screenshot Card (480px x 270px) -->
  <g transform="translate(680, 35)" filter="url(#card-shadow-08)">
    <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-08)" stroke-width="1.8" />
    
        <rect width="480" height="270" rx="14" fill="#080C16" />
        <!-- Top Bar -->
        <rect width="480" height="28" fill="#0F172A" />
        <circle cx="16" cy="14" r="4" fill="#EF4444" />
        <circle cx="28" cy="14" r="4" fill="#F59E0B" />
        <circle cx="40" cy="14" r="4" fill="#10B981" />
        <text x="60" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">01_hello.c &#8212; C-Programming-Lab</text>
        <!-- Sidebar File Tree -->
        <rect x="0" y="28" width="130" height="242" fill="#060910" />
        <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#64748B">&#128193; c_programs</text>
        <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">&#128196; 01_hello.c</text>
        <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">&#128196; 02_fibonacci.c</text>
        <text x="24" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">&#128196; 03_prime.c</text>
        <text x="24" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">&#128196; 04_pointers.c</text>
        <text x="24" y="150" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">&#128196; 05_strings.c</text>
        <!-- Editor Code Content -->
        <g transform="translate(145, 45)">
          <text font-family="'JetBrains Mono', monospace" font-size="12" line-height="1.7">
            <tspan x="0" dy="0" fill="#64748B">1  </tspan><tspan fill="#EF4444">#include </tspan><tspan fill="#FACC15">&lt;stdio.h&gt;</tspan>
            <tspan x="0" dy="24" fill="#64748B">2  </tspan>
            <tspan x="0" dy="24" fill="#64748B">3  </tspan><tspan fill="#3B82F6">int </tspan><tspan fill="#F8FAFC">main() &#123;</tspan>
            <tspan x="0" dy="24" fill="#64748B">4  </tspan><tspan fill="#CBD5E1">    printf(</tspan><tspan fill="#22C55E">"Hello, World!\n"</tspan><tspan fill="#CBD5E1">);</tspan>
            <tspan x="0" dy="24" fill="#64748B">5  </tspan><tspan fill="#3B82F6">    return </tspan><tspan fill="#C084FC">0</tspan><tspan fill="#CBD5E1">;</tspan>
            <tspan x="0" dy="24" fill="#64748B">6  </tspan><tspan fill="#F8FAFC">&#125;</tspan>
          </text>
        </g>
        
  </g>

  <!-- Project Description Card -->
  <g transform="translate(50, 50)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">C Programming Lab</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8">Practical Programs Collection</text>
    
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#CBD5E1">
      <tspan x="0" dy="0">A collection of C programs and lab assignments</tspan>
      <tspan x="0" dy="24">with proper documentation and explanations.</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(0, 155)">
      
        <g transform="translate(0, 0)">
          <rect width="31" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="15" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">C</text>
        </g>
        
        <g transform="translate(39, 0)">
          <rect width="157" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="78" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Data Structures</text>
        </g>
        
        <g transform="translate(204, 0)">
          <rect width="112" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="56" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Algorithms</text>
        </g>
        
    </g>

    <!-- Action Links -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">View Docs ↗   |   GitHub ↗</text>
    </g>
  </g>
</svg>