<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="spine-grad-05" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="node-glow-05" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ss-border-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <filter id="card-shadow-05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38BDF8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Vertical Spine (Continuous through 340px) -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-05)" stroke-width="4" filter="url(#node-glow-05)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Numbered Glowing Node (60px diameter) -->
  <g transform="translate(600, 170)">
    <circle cx="0" cy="0" r="38" fill="#3B82F6" fill-opacity="0.45" filter="url(#node-glow-05)" />
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text>
  </g>

  <!-- Big Screenshot Card (480px x 270px) -->
  <g transform="translate(40, 35)" filter="url(#card-shadow-05)">
    <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-05)" stroke-width="1.8" />
    
        <rect width="480" height="270" rx="14" fill="#F1F5F9" />
        <!-- Top App Bar -->
        <rect width="480" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#EF4444" />
        <circle cx="28" cy="16" r="4" fill="#F59E0B" />
        <circle cx="40" cy="16" r="4" fill="#10B981" />
        <text x="60" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">Hospital Management System</text>
        <!-- Sidebar -->
        <rect x="0" y="32" width="100" height="238" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="50" width="80" height="24" rx="4" fill="#0284C7" />
        <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Dashboard</text>
        <text x="20" y="95" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Patients</text>
        <text x="20" y="120" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Doctors</text>
        <text x="20" y="145" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Wards</text>
        <!-- Stat Cards -->
        <g transform="translate(115, 45)">
          <rect x="0" y="0" width="105" height="55" rx="8" fill="#0284C7" />
          <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#E0F2FE">Total Patients</text>
          <text x="12" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">1,420</text>
          
          <rect x="120" y="0" width="105" height="55" rx="8" fill="#0D9488" />
          <text x="132" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#CCFBF1">Appointments</text>
          <text x="132" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">384</text>
          
          <rect x="240" y="0" width="105" height="55" rx="8" fill="#6366F1" />
          <text x="252" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#E0E7FF">Available Beds</text>
          <text x="252" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">56</text>
        </g>
        <!-- Table Mockup -->
        <rect x="115" y="115" width="345" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="115" y="115" width="345" height="28" fill="#F8FAFC" />
        <text x="130" y="133" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">Patient Name</text>
        <text x="240" y="133" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">Doctor</text>
        <text x="330" y="133" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">Status</text>
        <line x1="115" y1="170" x2="460" y2="170" stroke="#F1F5F9" stroke-width="1" />
        <line x1="115" y1="200" x2="460" y2="200" stroke="#F1F5F9" stroke-width="1" />
        
  </g>

  <!-- Project Description Card -->
  <g transform="translate(670, 50)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">Hospital Management System</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8">Web Application</text>
    
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#CBD5E1">
      <tspan x="0" dy="0">Manage patients, doctors, appointments, wards and</tspan>
      <tspan x="0" dy="24">billing. Built with Laravel and MySQL.</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(0, 155)">
      
        <g transform="translate(0, 0)">
          <rect width="85" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Laravel</text>
        </g>
        
        <g transform="translate(93, 0)">
          <rect width="67" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="33" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">MySQL</text>
        </g>
        
        <g transform="translate(168, 0)">
          <rect width="103" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="51" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Bootstrap</text>
        </g>
        
        <g transform="translate(279, 0)">
          <rect width="112" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="56" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">JavaScript</text>
        </g>
        
    </g>

    <!-- Action Links -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">Live Demo ↗   |   GitHub ↗</text>
    </g>
  </g>
</svg>