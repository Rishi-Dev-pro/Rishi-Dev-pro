<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="spine-grad-04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="node-glow-04" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ss-border-04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7" />
    </linearGradient>

    <filter id="card-shadow-04" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00F0FF" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Vertical Spine (Continuous through 340px) -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-04)" stroke-width="4" filter="url(#node-glow-04)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Numbered Glowing Node (60px diameter) -->
  <g transform="translate(600, 170)">
    <circle cx="0" cy="0" r="38" fill="#10B981" fill-opacity="0.45" filter="url(#node-glow-04)" />
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text>
  </g>

  <!-- Big Screenshot Card (480px x 270px) -->
  <g transform="translate(680, 35)" filter="url(#card-shadow-04)">
    <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-04)" stroke-width="1.8" />
    
        <rect width="480" height="270" rx="14" fill="#090E1A" />
        <!-- Top bar -->
        <rect width="480" height="28" fill="#0F172A" />
        <circle cx="16" cy="14" r="4" fill="#EF4444" />
        <circle cx="28" cy="14" r="4" fill="#F59E0B" />
        <circle cx="40" cy="14" r="4" fill="#10B981" />
        <text x="60" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">vn-media.app // feed</text>
        <!-- Sidebar -->
        <rect x="0" y="28" width="80" height="242" fill="#070B14" />
        <line x1="20" y1="50" x2="60" y2="50" stroke="#334155" stroke-width="2" />
        <line x1="20" y1="70" x2="50" y2="70" stroke="#1E293B" stroke-width="2" />
        <line x1="20" y1="90" x2="60" y2="90" stroke="#1E293B" stroke-width="2" />
        <!-- Central Post Card -->
        <rect x="100" y="45" width="230" height="150" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <circle cx="120" cy="65" r="10" fill="#3B82F6" />
        <text x="140" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Rishi Shaw</text>
        <text x="140" y="78" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">@rishidev &#8226; 2h ago</text>
        <rect x="115" y="95" width="200" height="8" rx="4" fill="#1E293B" />
        <rect x="115" y="112" width="160" height="8" rx="4" fill="#1E293B" />
        <rect x="115" y="132" width="200" height="50" rx="6" fill="#162238" />
        <!-- Right side widgets -->
        <rect x="345" y="45" width="120" height="100" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <text x="355" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">Suggested</text>
        <circle cx="365" cy="82" r="8" fill="#C084FC" />
        <circle cx="365" cy="110" r="8" fill="#10B981" />
        
  </g>

  <!-- Project Description Card -->
  <g transform="translate(50, 50)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#00F0FF">VN Media</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8">Social Media &amp; Content Platform</text>
    
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#CBD5E1">
      <tspan x="0" dy="0">A full-stack social media platform with real-time</tspan>
      <tspan x="0" dy="24">features, content feeds, user profiles and more.</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(0, 155)">
      
        <g transform="translate(0, 0)">
          <rect width="112" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="56" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">JavaScript</text>
        </g>
        
        <g transform="translate(120, 0)">
          <rect width="85" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Node.js</text>
        </g>
        
        <g transform="translate(213, 0)">
          <rect width="85" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Express</text>
        </g>
        
        <g transform="translate(306, 0)">
          <rect width="85" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">MongoDB</text>
        </g>
        
    </g>

    <!-- Action Links -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">Live Demo ↗   |   GitHub ↗</text>
    </g>
  </g>
</svg>