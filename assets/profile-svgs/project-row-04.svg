<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Continuous Vertical Glowing Spine -->
    <linearGradient id="spine-grad-04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glowing Node Filter -->
    <filter id="node-glow-04" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Screenshot Border Gradient -->
    <linearGradient id="ss-border-04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6" />
    </linearGradient>

    <filter id="card-shadow-04" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00F0FF" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ── 1. Central Vertical Spine (Continuous through 340px) ── -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-04)" stroke-width="4" filter="url(#node-glow-04)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- ── 2. Center Numbered Glowing Node (60px diameter) ── -->
  <g transform="translate(600, 170)">
    <!-- Outer Glow Halo -->
    <circle cx="0" cy="0" r="38" fill="#10B981" fill-opacity="0.45" filter="url(#node-glow-04)" />
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#00F0FF" stroke-width="2.5" />
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
    <!-- Bold Number -->
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text>
  </g>

  <!-- ── 3. Big Screenshot Card (480px x 270px, 16:9 ratio) ── -->
  <g transform="translate(680, 35)" filter="url(#card-shadow-04)">
    <!-- Card Frame -->
    <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-04)" stroke-width="1.8" />
    
    <!-- Window Bar -->
    <rect width="480" height="32" rx="16" fill="#0F172A" fill-opacity="0.7" />
    <circle cx="20" cy="16" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="16" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="16" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="68" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">vn-media.system</text>

    <!-- Preview HUD Artwork -->
    <g transform="translate(250, 60)">
      <rect width="200" height="180" rx="10" fill="#070C18" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="100" cy="90" r="50" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />
      <circle cx="100" cy="90" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="1.5" />
      <circle cx="100" cy="90" r="8" fill="#00F0FF" />
    </g>

    <!-- Left Project Typography & Replacement Badge -->
    <g transform="translate(32, 70)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">VN Media</text>
      <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00F0FF">Social Media & Content Platform</text>
      
      <!-- Replacement Indicator Pill -->
      <g transform="translate(0, 85)">
        <rect width="200" height="36" rx="8" fill="#060A14" stroke="#00F0FF" stroke-width="1.2" />
        <text x="100" y="23" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1">PROJECT_SCREENSHOT_04</text>
      </g>
    </g>
  </g>

  <!-- ── 4. Project Description Card ── -->
  <g transform="translate(50, 50)">
    <!-- Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#00F0FF">VN Media</text>
    
    <!-- Category -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8">Social Media & Content Platform</text>
    
    <!-- Description Paragraph -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#CBD5E1" line-height="1.6">
      <tspan x="0" dy="0">A full-stack social media platform with real-time features,</tspan>
      <tspan x="0" dy="24">content feeds, user profiles and interactive media distribution.</tspan>
    </text>

    <!-- Technology Badges -->
    <g transform="translate(0, 155)">
      
        <g transform="translate(0, 0)">
          <rect width="110" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="55" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">JavaScript</text>
        </g>
        
        <g transform="translate(118, 0)">
          <rect width="83" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="41" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Node.js</text>
        </g>
        
        <g transform="translate(209, 0)">
          <rect width="83" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="41" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Express</text>
        </g>
        
        <g transform="translate(300, 0)">
          <rect width="83" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="41" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">MongoDB</text>
        </g>
        
    </g>

    <!-- Action Links -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">
        Live Demo ↗ &nbsp;&nbsp;<tspan fill="#64748B">|</tspan>&nbsp;&nbsp; GitHub ↗
      </text>
    </g>
  </g>
</svg>