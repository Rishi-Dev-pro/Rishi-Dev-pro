<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="spine-grad-06" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="node-glow-06" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ss-border-06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7" />
    </linearGradient>

    <filter id="card-shadow-06" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#F59E0B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Vertical Spine (Continuous through 340px) -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="url(#spine-grad-06)" stroke-width="4" filter="url(#node-glow-06)" />
  <line x1="600" y1="0" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Numbered Glowing Node (60px diameter) -->
  <g transform="translate(600, 170)">
    <circle cx="0" cy="0" r="38" fill="#3B82F6" fill-opacity="0.45" filter="url(#node-glow-06)" />
    <circle cx="0" cy="0" r="30" fill="#070B16" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#0A0F1D" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">06</text>
  </g>

  <!-- Big Screenshot Card (480px x 270px) -->
  <a href="https://github.com/Rishi-Dev-pro/S-PPT-maker" xlink:href="https://github.com/Rishi-Dev-pro/S-PPT-maker" target="_blank" style="cursor: pointer;">
    <g transform="translate(680, 35)" filter="url(#card-shadow-06)">
      <rect width="480" height="270" rx="16" fill="#0A0F1E" stroke="url(#ss-border-06)" stroke-width="1.8" />
      
        <rect width="480" height="270" rx="14" fill="#0A0F1D" />
        <rect width="480" height="34" fill="#141E33" stroke="#1E293B" stroke-width="1" />
        <rect x="14" y="8" width="18" height="18" rx="4" fill="#EA580C" />
        <text x="23" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>
        <text x="40" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">S-PPT-maker</text>
