        </g>
        
        <g transform="translate(120, 0)">
          <rect width="67" height="26" rx="13" fill="#0B1325" stroke="#1E293B" stroke-width="1" />
          <text x="33" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">React</text>
        </g>
        
        <g transform="translate(195, 0)">
