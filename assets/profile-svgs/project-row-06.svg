  <!-- Project Description Card -->
  <g transform="translate(50, 50)">
    <a href="https://github.com/Rishi-Dev-pro/S-PPT-maker" xlink:href="https://github.com/Rishi-Dev-pro/S-PPT-maker" target="_blank" style="cursor: pointer;">
