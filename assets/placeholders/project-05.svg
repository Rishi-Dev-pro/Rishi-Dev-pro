<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-PROJECT_SCREENSHOT_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0A1020" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Neon Rim Border Gradient -->
    <linearGradient id="border-PROJECT_SCREENSHOT_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Luminous Glow -->
    <radialGradient id="glow-PROJECT_SCREENSHOT_05" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid-PROJECT_SCREENSHOT_05" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.35" />
    </pattern>

    <!-- Filter for Luminous Accents -->
    <filter id="neon-glow-PROJECT_SCREENSHOT_05" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="960" height="540" rx="16" fill="url(#bg-PROJECT_SCREENSHOT_05)" />
  <rect width="960" height="540" rx="16" fill="url(#grid-PROJECT_SCREENSHOT_05)" />
  <rect width="960" height="540" rx="16" fill="url(#glow-PROJECT_SCREENSHOT_05)" />

  <!-- Top Glass Bar with macOS Controls -->
  <rect x="0" y="0" width="960" height="46" rx="16" fill="#0B1120" fill-opacity="0.7" />
  <line x1="0" y1="46" x2="960" y2="46" stroke="#1E293B" stroke-width="1" />
  <circle cx="34" cy="23" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="54" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="74" cy="23" r="6" fill="#10B981" opacity="0.8" />
  <text x="100" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B" font-weight="600">system://workspaces/pirate-civ</text>

  <!-- Futuristic Visual Centerpiece / HUD Graphic -->
  <g transform="translate(540, 100)">
    <!-- Outer Translucent HUD Frame -->
    <rect x="0" y="0" width="360" height="350" rx="14" fill="#080E1C" fill-opacity="0.85" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2" />
    
    <!-- Reticle Circles & Telemetry -->
    <circle cx="180" cy="160" r="100" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="180" cy="160" r="70" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.6" />
    <circle cx="180" cy="160" r="40" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="2" filter="url(#neon-glow-PROJECT_SCREENSHOT_05)" />
    <circle cx="180" cy="160" r="12" fill="#F59E0B" opacity="0.85" />

    <!-- Waveform / HUD metrics -->
    <path d="M 40 290 Q 90 260 140 290 T 240 290 T 320 290" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8" />
    <circle cx="140" cy="290" r="3.5" fill="#F59E0B" />
    <circle cx="240" cy="290" r="3.5" fill="#00F0FF" />
    
    <!-- Diagnostic Bars -->
    <rect x="40" y="40" width="120" height="6" rx="3" fill="#1E293B" />
    <rect x="40" y="40" width="85" height="6" rx="3" fill="#F59E0B" opacity="0.8" />
    <rect x="40" y="55" width="180" height="6" rx="3" fill="#1E293B" />
    <rect x="40" y="55" width="130" height="6" rx="3" fill="#10B981" opacity="0.8" />
  </g>

  <!-- Left Side: Large Project Typography & Placeholder Indicator -->
  <g transform="translate(60, 160)">
    <!-- Subtitle category tag -->
    <rect x="0" y="0" width="auto" height="26" rx="6" fill="#F59E0B" fill-opacity="0.12" />
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1">PIRATE-THEMED E-COMMERCE WEBSITE</text>

    <!-- Main Project Name -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Pirate Civ</text>
    
    <!-- Secondary Features Subtext -->
    <text x="0" y="105" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">Treasure Loot Store • Custom Skull & Cutlass Theme • Seamless Checkout</text>

    <!-- Identifiable Replaceable Badge Pill -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="340" height="46" rx="10" fill="#060A14" fill-opacity="0.95" stroke="#F59E0B" stroke-width="1.5" filter="url(#neon-glow-PROJECT_SCREENSHOT_05)" />
      <circle cx="24" cy="23" r="5" fill="#F59E0B" />
      <text x="42" y="28" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="1.5">PROJECT_SCREENSHOT_05</text>
    </g>
  </g>

  <!-- Outer Neon Border Frame -->
  <rect width="960" height="540" rx="16" fill="none" stroke="url(#border-PROJECT_SCREENSHOT_05)" stroke-width="2" />
</svg>