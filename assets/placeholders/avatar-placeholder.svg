<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatar-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="horizon-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="198" fill="url(#avatar-bg)" />

  <!-- Horizon Twilight Arc -->
  <path d="M 10 260 Q 200 230 390 260 L 390 400 L 10 400 Z" fill="url(#horizon-glow)" />

  <!-- Developer Silhouette -->
  <!-- Head & Torso Silhouette looking towards horizon -->
  <path d="M 200 120 C 175 120 160 140 160 170 C 160 195 175 210 195 215 C 190 225 170 232 150 240 C 120 252 80 270 70 380 Q 200 400 330 380 C 320 270 280 252 250 240 C 230 232 210 225 205 215 C 225 210 240 195 240 170 C 240 140 225 120 200 120 Z" fill="#090d16" />

  <!-- Hoodie / Profile contours -->
  <path d="M 160 168 C 158 150 170 132 195 128 C 215 125 235 138 238 160 C 240 178 230 198 215 205 C 205 210 190 210 180 204 C 168 196 162 184 160 168 Z" fill="#05070d" />

  <!-- Subtle cyan rim lighting on hair/shoulder -->
  <path d="M 175 130 Q 195 126 215 132" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#soft-glow)" />
  <path d="M 152 240 C 125 252 90 270 80 340" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Overlay Placeholder Indicator text (Subtle) -->
  <rect x="75" y="325" width="250" height="28" rx="14" fill="#0b0f19" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
  <text x="200" y="343" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PROFILE_PHOTO_PLACEHOLDER</text>
</svg>
